<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243B78">
<title>Akshardham PMS</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Design tokens: Akshardham PMS PRD v1, section 6.2 */
:root{--pri:#3446A8;--pri-d:#243B78;--pri-l:#EBEEF8;--bg:#F3F5F9;--card:#FFFFFF;--ink:#182230;--mut:#667085;--line:#E2E6EF;
  --ok:#16865B;--ok-l:#E6F4EE;--warn:#D97706;--warn-t:#B54708;--warn-l:#FEF3E2;--bad:#D92D20;--bad-t:#B42318;--bad-l:#FEE4E2;
  --vp:#0E7490;--vp-l:#E0F2F7;--bl:#6941C6;--bl-l:#F0EBFB;--ns:#98A2B3;--ns-l:#F2F4F7;
  --r:12px;--rc:8px;--sh:0 1px 2px rgba(16,24,40,.05);--side:248px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Aptos,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:32px 24px}
.lcard img{height:52px;margin-bottom:18px}
.lcard h1{font-size:22px;margin:0;color:var(--pri-d)}
.lcard p{margin:4px 0 20px;color:var(--mut);font-size:14px}
.lerr{background:var(--bad-l);color:var(--bad-t);border-radius:var(--rc);padding:10px 12px;font-size:14px;margin-bottom:14px}
label.f{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
label.f small{font-weight:400;color:var(--mut)}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rc);background:#fff;font-size:16px;outline:none}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea.in{min-height:72px;resize:vertical}
.pin{letter-spacing:.4em;text-align:center;font-weight:600}

/* ---------- buttons, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--rc);border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad-t);border-color:#F4C7C3}
.btn.block{width:100%;height:44px;margin-top:18px}
.btn:disabled{opacity:.6;cursor:wait}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--ns-l);color:#475467}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-done{background:var(--ok-l);color:var(--ok)}.s-vp{background:var(--vp-l);color:var(--vp)}.s-wip{background:var(--warn-l);color:var(--warn-t)}
.s-nd{background:var(--bad-l);color:var(--bad-t)}.s-bl{background:var(--bl-l);color:var(--bl)}.s-ns{background:var(--ns-l);color:#475467}
.due{font-size:13px;color:var(--mut)}.due.soon{color:var(--warn-t);font-weight:600}.due.late{color:var(--bad-t);font-weight:600}
.role{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--pri-l);color:var(--pri-d)}

/* ---------- app shell (PRD 6.3) ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;transition:width .15s}
.brand{display:flex;align-items:center;gap:10px;height:64px;padding:0 18px;border-bottom:1px solid var(--line);overflow:hidden}
.brand img{height:32px}.brand b{font-size:15px;color:var(--pri-d);white-space:nowrap}
.snav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sgrp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:14px 10px 6px;white-space:nowrap}
.sitem{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:var(--rc);color:#344054;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;width:100%;text-align:left}
.sitem:hover{background:var(--bg)}.sitem.on{background:var(--pri-l);color:var(--pri-d);font-weight:600}
.sitem .cnt{margin-left:auto;font-size:12px;font-weight:600;background:var(--bad);color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.sfoot{border-top:1px solid var(--line);padding:10px}
.side.mini{--side:72px}.side.mini .sitem span,.side.mini .sitem .cnt,.side.mini .sgrp,.side.mini .brand b{display:none}.side.mini .sitem{justify-content:center}
.main{margin-left:var(--side);min-height:100vh;transition:margin .15s}
.side.mini~.main{margin-left:72px}
.tbar{position:sticky;top:0;z-index:15;height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.tbar h1{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:12.5px;color:var(--mut);line-height:1.2}
.tsearch{position:relative;margin-left:auto;width:280px}
.tsearch svg{position:absolute;left:11px;top:11px;color:var(--mut)}
.tsearch input{padding-left:36px;min-height:40px;font-size:14px}
.ibtn{position:relative;width:40px;height:40px;border-radius:var(--rc);display:grid;place-items:center;color:#475467}
.ibtn:hover{background:var(--bg)}
.ibtn .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center}
.menu{position:absolute;right:16px;top:58px;width:280px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(16,24,40,.14);z-index:40;overflow:hidden}
.menu h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.menu .mi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.menu .mi:hover{background:var(--bg)}.menu .mi:last-child{border:0}
.menu .mi small{display:block;color:var(--mut)}
.page{padding:24px 32px 48px;max-width:1360px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead h2{font-size:22px;margin:0}.phead p{margin:2px 0 0;color:var(--mut);font-size:14px}
.stale{display:flex;align-items:center;gap:8px;background:var(--warn-l);color:var(--warn-t);border-radius:var(--rc);padding:8px 12px;font-size:13.5px;margin-bottom:16px}
.bnav{display:none}

/* ---------- cards / dashboard (PRD 6.4 B) ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .ch h3{margin:0;font-size:15px}.card .ch small{color:var(--mut);font-size:12.5px}
.card .cb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:#C9D0E0}
.kpi span{font-size:13px;color:var(--mut);font-weight:500}
.kpi b{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi b em{font-style:normal;font-size:16px;color:var(--mut);font-weight:500}
.kpi small{font-size:12px;color:var(--mut)}
.kpi.bad b{color:var(--bad-t)}.kpi.warn b{color:var(--warn-t)}.kpi.good b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--ns-l)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:#344054}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;position:sticky;top:64px;white-space:nowrap}
.t td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}.t tbody tr:hover td{background:#FAFBFC}
.t .tid{font-weight:600;color:var(--mut);font-size:12.5px;white-space:nowrap}
.t .ttl{font-weight:600}
.t .r{text-align:right}
.bar{height:6px;border-radius:99px;background:var(--ns-l);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pri)}
.att{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
.att:last-child{border-bottom:0}.att:hover{background:#FAFBFC}
.att .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.att small{display:block;color:var(--mut);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats div{background:var(--bg);border-radius:var(--rc);padding:10px 12px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stats span{font-size:12.5px;color:var(--mut)}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:84px;height:84px}
.empty{text-align:center;padding:32px 16px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.skel{background:linear-gradient(90deg,#EEF0F4 25%,#F6F7F9 50%,#EEF0F4 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--rc)}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- tasks (PRD 6.4 D) ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:var(--rc);padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:6px;font-size:13.5px;font-weight:600;color:#475467}
.seg button.on{background:var(--pri-l);color:var(--pri-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:var(--rc);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:#344054}
.chip b{font-weight:600;color:var(--mut)}
.chip.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}.chip.on b{color:var(--pri-d)}
.mcards{display:none}
.tcard{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px}
.tcard .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tcard .ttl{font-weight:600;line-height:1.35}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;align-items:center;font-size:13px;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#EDF0F5;border-radius:var(--r);padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}
.col .tcard{padding:12px;margin-bottom:8px}
.blk{display:inline-flex;align-items:center;gap:4px;color:var(--bl);font-weight:600;font-size:12.5px}

/* ---------- drawer (task detail) ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(16,24,40,.12)}
.dh{display:flex;gap:10px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:2px 0 6px;font-size:18px;line-height:1.3}
.db{flex:1;overflow-y:auto;padding:16px 20px 32px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.box{background:var(--bg);border-radius:var(--rc);padding:12px 14px;font-size:14px;margin:10px 0;white-space:pre-line}
.box b{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:4px}
.act{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.act h4{margin:0 0 4px;font-size:15px}.act p{margin:0 0 8px;color:var(--mut);font-size:13.5px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rc);font-weight:600;font-size:14px;text-align:left;background:#fff}
.st i{width:10px;height:10px;border-radius:3px;flex:none}
.st.on{border-color:var(--pri);background:var(--pri-l);box-shadow:inset 0 0 0 1px var(--pri)}
.brow{display:flex;gap:8px;margin-top:14px}.brow .btn{flex:1}
.filein{display:flex;align-items:center;gap:10px;border:1px dashed #C9D0E0;border-radius:var(--rc);padding:10px 12px;font-size:14px;color:var(--mut);cursor:pointer}
.filein input{position:absolute;opacity:0;width:1px;height:1px}

/* ---------- task edit, messages, task map, leads ---------- */
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:var(--rc);background:#fff;font-size:13.5px;font-weight:500}
.pick button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:600}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border-color:#F5D9A8;background:var(--warn-l)}
.banner div{flex:1;min-width:200px;font-size:14px}.banner b{display:block}
.sec{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:20px 2px 10px}
.msgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bubble{background:#E7F6E9;border-radius:var(--rc);padding:12px 14px;font-size:14px;white-space:pre-wrap;max-height:360px;overflow-y:auto;line-height:1.55}
.bubble.private{background:var(--bg)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.sent{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:13px;font-weight:600;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tile{height:46px;border-radius:var(--rc);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border:2px solid transparent}
.tile small{font-size:10px;font-weight:600;opacity:.8}
.tile.late{border-color:var(--bad)}
.cmp{font-size:11.5px;color:var(--mut)}.cmp.up{color:var(--ok)}.cmp.down{color:var(--bad-t)}
.call{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--rc);border:1px solid var(--line);color:var(--ok);flex:none;margin-left:auto}

/* ---------- field data frame ---------- */
.frame{border:0;width:100%;height:calc(100vh - 64px);display:block;background:var(--bg)}
.page.flush{padding:0;max-width:none}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--rc);font-weight:500;font-size:14px;z-index:90;max-width:90vw;text-align:center}
#toast.bad{background:var(--bad-t)}

/* ---------- responsive (PRD 6.5) ---------- */
@media (max-width:1279px){.msgs{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}.tsearch{width:220px}}
@media (max-width:1023px){.side{--side:72px}.side .sitem span,.side .sitem .cnt,.side .sgrp,.side .brand b{display:none}.side .sitem{justify-content:center}.main{margin-left:72px}.grid2{grid-template-columns:1fr}.page{padding:20px 16px 40px}.tbar{padding:0 16px}}
@media (max-width:767px){
  .side{display:none}.main,.side.mini~.main{margin-left:0}
  .tbar{height:56px;padding:0 12px}.tbar h1{font-size:17px}.tsearch{display:none}
  .page{padding:16px 12px calc(88px + env(safe-area-inset-bottom))}
  .page.flush{padding:0}
  .frame{height:calc(100vh - 56px)}
  .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi b{font-size:24px}
  .grid3{grid-template-columns:1fr}
  .t th{top:56px}
  .desk{display:none}.mcards{display:block}
  .phead h2{font-size:19px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mut);padding:4px 0;position:relative}
  .bnav button.on{color:var(--pri)}
  .bnav .dot{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center}
  body.field .bnav{display:none}
  .menu{right:8px;left:8px;width:auto}
  .drawer{top:auto;max-height:92vh;border-radius:16px 16px 0 0}
  #toast{bottom:84px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="photo" accept="image/*" hidden>
<script>
/* ======= Backend URLs (purane dono backend, bas ek app) ======= */
const TASKS_API = 'https://script.google.com/macros/s/AKfycbydef8G6aaxfIyQgwJ_84rZ6GXteVujzoi7D9zLtPOq8iybGZinIIwpTiWzyJD8ad1EFg/exec';
const FIELD_API = 'https://script.google.com/macros/s/AKfycbxgNOAHAa7v1LmnoklvbeHt2kGYBB_7Bq2tqI-8yJQT73VZXgjytt6J_JOetGF5CU4c/exec';
const FIELD_APP = '../Sarola-Database/?embed=1';   // Field Data screen (same website, isliye login wahan bhi chalta hai)
const PROJECT = 'Project Sarola';
const VER = '30 Oct · v2';
/* =============================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) { } } };

/* ---------------- API ---------------- */
async function post(url, body) {
  let r;
  try { r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }) }
  catch (e) { throw new Error('Could not reach the server. Check your internet connection.') }
  let j; try { j = await r.json() } catch (e) { throw new Error('The server sent an unexpected response.') }
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j.data;
}
const api = (action, p) => post(TASKS_API, Object.assign({ action }, S.token ? { token: S.token } : {}, p || {}));
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, bad ? 5000 : 2600) }
const isAuthErr = e => /Login|PIN|Code galat/i.test(e.message);

/* ---------------- routing: #/overview  #/tasks  #/tasks/P1-03  #/tasks/P1-03/edit  #/tasks/new  #/report  #/messages  #/field ---------------- */
const VIEWS = ['overview', 'tasks', 'report', 'messages', 'field'];
const route = () => { const p = location.hash.replace(/^#\/?/, '').split('/'); let v = VIEWS.includes(p[0]) ? p[0] : 'overview';
  if (v === 'messages' && !isMgr()) v = 'overview'; return { view: v, task: p[1] ? decodeURIComponent(p[1]) : '', edit: p[2] === 'edit' || p[1] === 'new' } };
const go = (view, task, sub) => { location.hash = '#/' + view + (task ? '/' + encodeURIComponent(task) : '') + (sub ? '/' + sub : '') };
addEventListener('hashchange', () => render());

/* ---------------- data ---------------- */
const myTasks = () => (S.me && S.me.tasks) || [];
const toAccept = () => myTasks().filter(t => t.needsAccept);
const toReport = () => myTasks().filter(t => t.canReport && !t.needsAccept);
const toVerify = () => myTasks().filter(t => t.canVerify);
const dashTask = id => (isMgr() && S.dash && S.dash.tasks.find(t => t.id === id)) || null;
const tel = (m, who) => m ? `<a class="call" href="tel:${esc(m)}" aria-label="Call ${esc(who || '')}" onclick="event.stopPropagation()">${I.phone}</a>` : '';
const pendingReport = () => toReport().filter(t => !t.reportedToday);
const notifCount = () => toAccept().length + pendingReport().length + toVerify().length;
const isMgr = () => S.me && S.me.isCoordinator;
function allTasks() { return isMgr() && S.dash ? S.dash.tasks : [] }
function taskById(id) { return myTasks().find(t => t.id === id) || allTasks().find(t => t.id === id) }

async function boot() {
  ls.set('ts_pin', null);
  if (!S.token) return renderLogin();
  let cached = null; try { cached = JSON.parse(ls.get('pms_me_' + S.code)) } catch (e) { }
  if (cached) { S.me = cached; S.stale = true; try { S.dash = JSON.parse(ls.get('pms_dash')) } catch (e) { } render() } else renderLoading();
  await refresh(true);
}
async function refresh(quiet) {
  try {
    const me = await api('login'); if (me.token) { S.token = me.token; ls.set('ts_token', me.token); delete me.token }
    S.me = me; S.code = me.code; ls.set('ts_code', me.code); ls.set('pms_me_' + me.code, JSON.stringify(me)); S.stale = false; S.err = '';
    if (me.isCoordinator) { if (!S.team.length) api('team').then(t => S.team = t).catch(() => { }); S.dash = await api('dashboard'); S.dash.at = Date.now(); ls.set('pms_dash', JSON.stringify(S.dash)) }
    loadField();
    render(); if (!quiet) toast('Updated');
  } catch (e) {
    if (isAuthErr(e)) return logout(e.message);
    if (S.me) { S.stale = true; S.err = e.message; render() } else renderError(e.message);
  }
}
async function loadField() {   // Field database completion (Overview card ke liye)
  try { S.field = await post(FIELD_API, { action: 'init', token: S.token }); render() } catch (e) { S.field = { err: e.message.replace(/^LOGIN:\s*/, '') }; render() }
}
function logout(msg) {
  ['ts_token', 'ts_pin', 'ts_me_' + S.code, 'pms_me_' + S.code, 'pms_dash', 'sfd_cache'].forEach(k => ls.set(k, null));
  S = Object.assign(S, { token: '', me: null, dash: null, field: null, msgs: null, ed: null, person: '', menu: '' }); history.replaceState(null, '', location.pathname); renderLogin(msg);
}

async function renderLogin(err) {

  $('#root').innerHTML = `<div class="login"><form class="lcard" id="lf">
    <img src="logo.png" alt="Akshardham Associates" onerror="this.remove()">
    <h1>Akshardham PMS</h1><p>Project management and field operations</p>
    ${err ? `<div class="lerr" role="alert">${esc(err)}</div>` : ''}
    <label class="f" for="lc">Name</label><select class="in" id="lc" required><option value="">Loading team…</option></select>
    <label class="f" for="lp">PIN</label><input class="in pin" id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required>
    <button class="btn pri block" id="lb">Sign in</button>
    <p style="margin:14px 0 0;text-align:center">Forgot your PIN? Ask your coordinator.</p></form></div>`;
  $('#lf').onsubmit = async ev => {
    ev.preventDefault(); const b = $('#lb'); b.disabled = true; b.textContent = 'Signing in…';
    try { const me = await post(TASKS_API, { action: 'login', code: $('#lc').value, pin: $('#lp').value.trim() });
      S.token = me.token; ls.set('ts_token', me.token); ls.set('ts_code', me.code); delete me.token; S.me = me; S.code = me.code;
      if (!location.hash) go('overview'); render(); refresh(true) }
    catch (e) { renderLogin(e.message) }
  };
  try { S.team = await post(TASKS_API, { action: 'team' }) } catch (e) { }
  const sel = $('#lc'); if (!sel) return;
  sel.innerHTML = `<option value="">Select your name</option>` + S.team.map(m => `<option value="${esc(m.code)}" ${m.code === S.code ? 'selected' : ''}>${esc(m.naam)}</option>`).join('');
}

function renderError(m) { $('#root').innerHTML = `<div class="login"><div class="lcard"><h1>Can't load the workspace</h1><div class="lerr" style="margin-top:14px">${esc(m)}</div><button class="btn pri block" onclick="boot()">Try again</button><button class="btn block" style="margin-top:8px" onclick="logout()">Sign out</button></div></div>` }

/* ---------------- Overview: executive (PRD 6.4 B) ---------------- */
function vExec() {
  const d = S.dash;

  const late = openT.filter(t => t.daysLeft !== '' && t.daysLeft < 0), blocked = T.filter(t => t.status === 'Blocked');
  const rep = d.people.reduce((a, p) => [a[0] + p.repToday, a[1] + p.dueToday], [0, 0]);
  const acc = d.people.reduce((a, p) => [a[0] + p.accepted, a[1] + p.accTotal], [0, 0]);
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';

  const noOwner = T.filter(t => t.noOwner);
  const att = [
    ...late.map(t => [I.alert, 's-nd', t, `${-t.daysLeft}d overdue · A: ${t.aNames || '—'}`]),
    ...blocked.map(t => [I.block, 's-bl', t, `Blocked · ${(t.last && t.last.rukawat) || 'reason not given'}`]),
    ...noOwner.map(t => [I.user, 's-wip', t, 'No accountable or responsible owner']),
    ...(d.doubts || []).map(x => [I.help, 's-wip', null, `${x.naam} has a question: ${x.doubt}`, x.kaam, x.mobile, x.naam]),
    ...(d.silent || []).map(x => [I.clock, 's-ns', null, `${x.naam}: no report for ${x.days} days`, x.kaam, x.mobile, x.naam])];
  return `<div class="phead"><div><h2>${esc(PROJECT)} overview</h2><p>As of ${esc(d.today)}, ${esc(d.updated)} · ${d.total} tasks · ${d.total ? Math.round((c['Done'] || 0) / d.total * 100) : 0}% done</p></div>

  <div class="kpis">
    ${kpi('Open tasks', openT.length, `${c['Done'] || 0} done of ${d.total}`, '', 'open')}
    ${kpi('Overdue', late.length, 'Open tasks past due date', late.length ? 'bad' : 'good', 'late')}
    ${kpi('Blocked', blocked.length, 'Need help to move', blocked.length ? 'bad' : 'good', 'Blocked')}
    ${kpi('Awaiting verification', c['Verify Pending'] || 0, 'Done, waiting for accountable', (c['Verify Pending'] ? 'warn' : ''), 'Verify Pending')}
    ${kpi("Today's report compliance", `${pct(rep[0], rep[1])}`, `${rep[0]} of ${rep[1]} expected reports`, rep[1] && rep[0] < rep[1] ? 'warn' : 'good', 'open')}
    ${kpi('Tasks accepted', `${acc[0]}<em>/${acc[1]}</em>`, 'Owner assignments accepted', acc[0] < acc[1] ? 'warn' : 'good', 'all')}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="cb"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Work status</b><small style="color:var(--mut)">${d.total} tasks</small></div>
    <div class="stack" role="img" aria-label="Task status distribution">${ORDER.map(s => c[s] ? `<i style="width:${c[s] / d.total * 100}%;background:${ST[s][2]}"></i>` : '').join('')}</div>
    <div class="legend">${ORDER.map(s => `<span><i style="background:${ST[s][2]}"></i>${ST[s][0]} <b class="num">${c[s] || 0}</b></span>`).join('')}</div></div></div>
  <div class="grid2">
    <div class="card"><div class="ch"><h3>Team accountability</h3><small>Today</small></div>
      <table class="t"><thead><tr><th>Person</th><th class="r">Open</th><th class="r">Overdue</th><th>Today's reports</th><th class="r">Accepted</th></tr></thead><tbody>
      ${d.people.map(p => { const o = p.total - (p.st['Done'] || 0) - (p.st['Verify Pending'] || 0); return `<tr onclick="S.scope='all';S.filter='all';S.q='';S.person='${esc(p.code)}';go('tasks')" title="Show ${esc(p.naam)}'s tasks"><td><div style="display:flex;align-items:center;gap:8px"><b>${esc(p.naam)}</b>${tel(p.mobile, p.naam)}</div></td><td class="r num">${o}</td><td class="r num" style="${p.late ? 'color:var(--bad-t);font-weight:600' : ''}">${p.late}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${p.dueToday ? p.repToday / p.dueToday * 100 : 0}%"></i></div><span class="num" style="font-size:13px">${p.repToday}/${p.dueToday}</span></div></td><td class="r num">${p.accepted}/${p.accTotal}</td></tr>` }).join('')}

/* Field database completion: Field Database app ke calc() jaisa hi formula (Targets tab se). Formula badle to dono jagah badalna. */
function fieldCard() {
  const F = S.field;
  const head = '<div class="card"><div class="ch"><h3>Field database</h3><a href="#/field" style="font-size:13px">Open</a></div><div class="cb">';
  if (!F) return head + '<div class="skel" style="height:84px"></div></div></div>';
  if (F.err) return head + `<div class="empty" style="padding:16px"><b>Field data unavailable</b>${esc(F.err)}</div></div></div>`;
  const rows = k => F.data[k] || [], ent = k => F.schema.find(e => e.key === k), V = rows('Villages');
  const miss = (e, r) => e.fields.some(f => f.req && (!r[f.k] || (f.t === 'tel' && !/^[6-9]\d{9}$/.test(r[f.k]))));
  const td = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  const L = F.targets.filter(t => ent(t.Entity)).map(t => {
    const e = ent(t.Entity), min = +t.Minimum || 1, ok = rows(t.Entity).filter(r => !miss(e, r) && (!t.Field || (t.Value === '*' ? !!r[t.Field] : String(r[t.Field] || '').split(', ').includes(t.Value))));
    const need = t.Scope === 'PerVillage' ? min * V.length : min, have = t.Scope === 'PerVillage' ? V.reduce((a, v) => a + Math.min(min, ok.filter(r => r.VillageID === v.ID).length), 0) : Math.min(min, ok.length);
    const p = need ? have / need : 0; return { p, late: t.Deadline && t.Deadline < td && p < 1 } });
  const pct = L.length ? Math.round(L.reduce((a, l) => a + l.p, 0) / L.length * 100) : 0, late = L.filter(l => l.late).length, C = 2 * Math.PI * 34;
  return head + `<div class="ring"><svg viewBox="0 0 84 84" role="img" aria-label="${pct}% complete"><circle cx="42" cy="42" r="34" fill="none" stroke="#EDF0F5" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--pri)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="#182230">${pct}%</text></svg>
    <div><b>${V.length} villages · ${rows('People').length} people</b><p style="margin:4px 0 0;font-size:13px;color:${late ? 'var(--bad-t)' : 'var(--mut)'}">${late ? late + ' targets past deadline' : 'All targets on schedule'}</p></div></div></div></div>`;
}

      <button class="ibtn" onclick="go('${back}')" aria-label="Close">${I.x}</button></div>
    <div class="db">
      <dl class="kv"><dt>Due</dt><dd>${(d => !t.deadline || d.includes('>' + esc(t.deadline) + '<') ? d : esc(t.deadline) + ' · ' + d)(dueTxt(t))}</dd><dt>Accountable</dt><dd>${esc(t.aNames || '—')}</dd><dt>Responsible</dt><dd>${esc(t.rNames || '—')}</dd></dl>
      ${t.done ? `<div class="box"><b>Done when</b>${esc(t.done)}</div>` : ''}
      ${t.steps ? `<div class="box"><b>How to do it</b>${esc(t.steps)}</div>` : ''}
      ${t.note ? `<div class="box" style="background:var(--warn-l)"><b>Note</b>${esc(t.note)}</div>` : ''}
      ${last ? `<div class="box"><b>Last report · ${esc(last.date)} · ${esc(last.naam)}</b>${stBadge(last.status)}<br>${esc(last.kya)}${last.kal ? '<br><span style="color:var(--mut)">Next: ' + esc(last.kal) + '</span>' : ''}${last.rukawat ? '<br><span style="color:var(--bad-t)">Blocker: ' + esc(last.rukawat) + '</span>' : ''}${last.proof ? `<br><a href="${esc(last.proof)}" target="_blank" rel="noopener">View proof</a>` : ''}</div>` : '<div class="box"><b>Last report</b>No report yet</div>'}
      ${dt && (dt.today || []).length && open_(dt.status) ? `<div class="box"><b>Today's reports</b><div class="who">${dt.today.map(x => `<span class="badge ${x.status ? ST[x.status][1] : 's-ns'}">${esc(x.naam)}: ${x.status ? esc(ST[x.status][0]) : 'not yet'}</span>`).join('')}</div></div>` : ''}
      ${dt && dt.noOwner ? '<div class="box" style="background:var(--bad-l);color:var(--bad-t)"><b style="color:var(--bad-t)">No owner</b>Choose an accountable and a responsible person (Edit).</div>' : ''}
      ${dt ? `<div class="brow" style="margin-top:0"><button class="btn" onclick="go('tasks','${esc(t.id)}','edit')">${I.edit}Edit</button><button class="btn danger" id="delbtn" onclick="delTask('${esc(t.id)}')">${I.trash}Delete</button></div>` : ''}
      ${actions || `<p style="color:var(--mut);font-size:13.5px">${mine && mine.canReport ? '' : mine ? 'You are kept informed on this task.' : 'You are not on this task.'} ${mine && mine.canReport ? '' : 'Only the accountable and responsible people can report on it.'}</p>`}
    </div></aside>`;
}
function pickSt(id, st, el) {   // status chuno bina form dobara banaye
  S.pick[id] = st; [...el.parentNode.children].forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-checked', b === el) });
  $('#rbl').innerHTML = st === 'Blocked' ? 'What is blocking you? Who can help?' : 'Blocker or help needed <small>(optional)</small>';
}
async function withBusy(btn, fn) { const b = btn && $(btn); if (b) { b.disabled = true } try { await fn() } catch (e) { if (isAuthErr(e)) return logout(e.message); toast(e.message, 1) } finally { if (b && document.contains(b)) b.disabled = false } }
async function doAccept(id, resp) {
  const doubt = ($('#dq') || {}).value || '';
  if (resp === 'Doubt' && !doubt.trim()) return toast('Write your question first', 1);
  await withBusy(null, async () => { const r = await api('accept', { items: [{ taskId: id, response: resp, doubt }] }); await setMe(r.me); toast(resp === 'Doubt' ? 'Question sent to the coordinator' : 'Task accepted'); redraw() });
}
async function doReport(id) {
  const status = S.pick[id], kya = $('#rk').value.trim(), kal = $('#rn').value.trim(), ruk = $('#rb').value.trim(), f = $('#rp').files[0];
  if (!status) return toast('Choose a status', 1); if (kya.length < 3) return toast('Write what you did today', 1); if (status === 'Blocked' && !ruk) return toast('Write what is blocking you', 1);
  await withBusy('#rbtn', async () => { const photo = f ? await compress(f) : null; const r = await api('report', { taskId: id, status, kya, kal, rukawat: ruk, photo });
    delete S.pick[id]; await setMe(r.me); toast(r.status === 'Verify Pending' ? 'Report sent. The accountable person will verify.' : 'Report sent'); go(route().view) });
}
async function doVerify(id, decision) {
  const comment = $('#vc').value.trim(); if (decision !== 'approve' && !comment) return toast('Write why you are sending it back', 1);
  await withBusy(null, async () => { const r = await api('verify', { taskId: id, decision, comment }); await setMe(r.me); toast(decision === 'approve' ? 'Approved as done' : 'Sent back'); go(route().view) });
}
async function setMe(me) {   // kaam ke baad naya data; coordinator ka dashboard bhi
  S.me = me; ls.set('pms_me_' + me.code, JSON.stringify(me));
  if (isMgr()) try { const d = await api('dashboard'); d.at = Date.now(); S.dash = d; ls.set('pms_dash', JSON.stringify(d)); render() } catch (e) { }
}

/* ---------------- Task add / edit / delete (sirf coordinator; Sheet me seedha) ---------------- */
function renderEdit(t) {
  const key = t ? t.id : 'new';
  if (!S.ed || S.ed.key !== key) S.ed = { key, a: t ? (t.aRaw || [])[0] || '' : '', r: t ? [...(t.rRaw || [])] : [], pr: t && t.priority === 'High' ? 'High' : 'Normal' };
  if (!S.team.length) api('team').then(x => { S.team = x; if (route().edit) renderEdit(t) }).catch(e => toast(e.message, 1));
  const team = S.team, back = t ? `go('tasks','${esc(t.id)}')` : `go('tasks')`;
  $('#drw').innerHTML = `<div class="scrim" onclick="${back}"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="dh"><div style="flex:1;min-width:0"><div class="crumb">${t ? esc(t.id) + ' · changes save to the Sheet' : 'A new row is added to the Sheet'}</div><h3 id="dt">${t ? 'Edit task' : 'New task'}</h3></div>
      <button class="ibtn" onclick="${back}" aria-label="Close">${I.x}</button></div>
    <div class="db">
      <label class="f" for="ek">Task</label><input class="in" id="ek" value="${esc(t ? t.kaam : '')}" placeholder="e.g. Put up 5 hoardings on the highway">
      <label class="f">Accountable (A) <small>one person, owns the outcome</small></label>
      <div class="pick" id="pa">${team.map(m => `<button type="button" class="${S.ed.a === m.code ? 'on' : ''}" onclick="S.ed.a='${esc(m.code)}';[...this.parentNode.children].forEach(b=>b.classList.toggle('on',b===this))">${esc(m.naam)}</button>`).join('') || '<span class="hint">Loading team…</span>'}</div>
      <label class="f">Responsible (R) <small>one or more, do the work</small></label>
      <div class="pick" id="pr">${team.map(m => `<button type="button" class="${S.ed.r.includes(m.code) ? 'on' : ''}" onclick="edR('${esc(m.code)}',this)">${esc(m.naam)}</button>`).join('')}</div>
      <label class="f" for="ed">Days to complete</label><input class="in" id="ed" type="number" min="1" max="365" inputmode="numeric" value="${esc(t ? t.din : 7)}" oninput="dlHint()">
      <div class="hint" id="edl"></div>
      <label class="f">Priority</label>
      <div class="pick">${['Normal', 'High'].map(x => `<button type="button" class="${S.ed.pr === x ? 'on' : ''}" onclick="S.ed.pr='${x}';[...this.parentNode.children].forEach(b=>b.classList.toggle('on',b===this))">${x}</button>`).join('')}</div>
      <label class="f" for="edn">Done when <small>(optional)</small></label><input class="in" id="edn" value="${esc(t ? t.done : '')}" placeholder="e.g. 5 hoardings up, photos shared">
      <label class="f" for="est">How to do it <small>(optional, one step per line)</small></label><textarea class="in" id="est" rows="4" placeholder="1. Finalise locations&#10;2. Get vendor rates">${esc(t ? t.steps : '')}</textarea>
      <div class="brow"><button class="btn" onclick="${back}">Cancel</button><button class="btn pri" id="esave" onclick="saveTask('${t ? esc(t.id) : ''}')">${t ? 'Save changes' : 'Add task'}</button></div>
    </div></aside>`;
  dlHint();
}
function edR(c, el) { const i = S.ed.r.indexOf(c); i < 0 ? S.ed.r.push(c) : S.ed.r.splice(i, 1); el.classList.toggle('on', i < 0) }
function dlHint() {
  const din = parseInt(($('#ed') || {}).value, 10), el = $('#edl'); if (!el) return;
  if (!(din >= 1)) return el.textContent = 'Enter the number of days';
  const t = S.ed.key !== 'new' && dashTask(S.ed.key), base = t && t.start ? new Date(t.start + 'T00:00:00') : new Date();
  base.setDate(base.getDate() + din);
  el.innerHTML = `Due date: <b>${base.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</b>${t && t.start ? ' (from start date)' : ' (from today)'}`;
}
async function saveTask(id) {
  const task = { id, kaam: $('#ek').value.trim(), a: S.ed.a, r: S.ed.r.join(','), din: $('#ed').value, priority: S.ed.pr, done: $('#edn').value.trim(), steps: $('#est').value.trim() };
  if (task.kaam.length < 3) return toast('Write the task name', 1); if (!task.a) return toast('Choose the accountable person', 1);
  if (!task.r) return toast('Choose at least one responsible person', 1); if (!(parseInt(task.din, 10) >= 1)) return toast('Enter the number of days', 1);
  await withBusy('#esave', async () => { const r = await api('taskSave', { task }); await setMe(r.me); S.ed = null;
    toast(id ? 'Changes saved to the Sheet' : `Task added (${r.id})`); go('tasks', r.id) });
}
async function delTask(id) {
  const t = dashTask(id); if (!t) return;
  if (!confirm(`Delete "${t.kaam}" permanently?\n\nIt is removed from the Sheet. Its old reports stay in the record.\n\nIf the work is finished, approve it as Done instead.`)) return;
  await withBusy('#delbtn', async () => { const r = await api('taskDelete', { taskId: id }); await setMe(r.me); toast('Task deleted from the Sheet'); go('tasks') });
}

/* ---------------- Messages (coordinator): subah / shaam ke WhatsApp message ---------------- */
async function loadMsgs(rebuild) {
  S.msgs = { loading: true };
  try { S.msgs = await api('messages', rebuild ? { rebuild } : {}) } catch (e) { if (isAuthErr(e)) return logout(e.message); S.msgs = { error: e.message } }
  if (route().view === 'messages') render();
}
function vMsgs() {
  const m = S.msgs;
  if (!m || m.loading) return '<div class="msgs">' + '<div class="card"><div class="cb"><div class="skel" style="height:18px;width:40%"></div><div class="skel" style="height:140px;margin-top:12px"></div></div></div>'.repeat(2) + '</div>';
  if (m.error) return `<div class="card empty"><b>Could not load messages</b>${esc(m.error)}<br><button class="btn" style="margin-top:12px" onclick="loadMsgs()">Try again</button></div>`;
  const sent = String(m.sent || '');
  const box = (key, title, old, hint, group, rebuild) => { const text = m[key], was = group && (sent.includes(title) || sent.includes(old));
    return `<div class="card"><div class="ch"><div><h3>${title}</h3><small>${hint}</small></div>${group ? '<span class="badge s-done">Group</span>' : '<span class="badge s-ns">Private</span>'}</div><div class="cb">
      ${text ? `<div class="bubble ${group ? '' : 'private'}">${esc(text)}</div>` : '<div class="empty" style="padding:16px"><b>Not created yet</b></div>'}
      <div class="mrow">${text && group ? `<a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener" onclick="markSent('${title}')">${I.send}Send on WhatsApp</a>` : ''}
        ${text ? `<button class="btn" onclick="copyMsg('${key}')">${I.copy}Copy</button>` : ''}
        ${rebuild ? `<button class="btn" onclick="loadMsgs('${rebuild}');render()">${I.refresh}${text ? 'Rebuild' : 'Create now'}</button>` : ''}</div>
      ${was ? `<div class="sent">${I.check}Sent today</div>` : ''}</div></div>` };
  return `<div class="phead"><div><h2>Today's messages</h2><p>${esc(m.date)} · read, then send to the Attendance group</p></div></div>
  <div class="msgs">${box('morning', 'Morning message', 'Subah ka message', "Today's tasks, for the Attendance group", true, 'morning')}
    ${box('evening', 'Evening feedback', 'Shaam ka feedback', 'Who worked, what is pending. Created automatically at 8 PM.', true, 'evening')}
    ${box('alerts', 'Your alerts', '', 'Do not post in the group. Call these people.', false, '')}
    ${box('krishan', 'Summary for Krishan Sir', '', 'Forward to Sir personally', false, '')}</div>`;
}
async function copyMsg(key) {
  const text = S.msgs[key];
  try { await navigator.clipboard.writeText(text) } catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove() }
  toast('Message copied');
}
async function markSent(which) { try { const r = await api('markSent', { which }); S.msgs.sent = (S.msgs.sent ? S.msgs.sent + '\n' : '') + r.sent; render() } catch (e) { } }
function compress(file) {
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res({ name: file.name, type: 'image/jpeg', data: c.toDataURL('image/jpeg', .72).split(',')[1] }) };
    img.onerror = () => rej(new Error('Could not open the photo. Try another one.')); img.src = url });
}
document.addEventListener('keydown', e => { const r = route(); if (e.key === 'Escape' && r.task) r.edit && r.task !== 'new' ? go(r.view, r.task) : go(r.view) });

boot();
</script>
</body>
</html>
